<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVP Mobile Navigation</title>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            max-width: 600px;
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            color: #10b981;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .badge-critical {
            background-color: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border-left: 5px solid #ef4444;
            padding: 15px;
            border-radius: 4px;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            font-weight: bold;
            margin-bottom: 20px;
            display: none;
        }
        .badge-safe {
            background-color: rgba(16, 185, 129, 0.1);
            color: #6ee7b7;
            border-left: 5px solid #10b981;
            padding: 15px;
            border-radius: 4px;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            font-weight: bold;
            margin-bottom: 20px;
            display: none;
        }

        .camera-container {
            width: 100%;
            max-width: 600px;
            background: #111;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            display: block;
            transform: scaleX(-1); /* mirror */
        }
        canvas { display: none; }

        .narrative-box {
            width: 100%;
            max-width: 600px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .narrative-box h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #a1a1aa;
            text-transform: uppercase;
        }
        .narrative-box p {
            margin: 0;
            font-size: 18px;
            color: #fff;
            line-height: 1.4;
        }

        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 600px;
        }
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: white;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
        .btn-start { background-color: #10b981; }
        .btn-stop { background-color: #ef4444; display: none; }
        .btn-vqa { background-color: #3b82f6; display: none; }
        
        .status {
            margin-top: 15px;
            color: #a1a1aa;
            font-size: 14px;
        }

    </style>
</head>
<body>

    <div class="header">
        <h1>👁️ AVP Live Navigation</h1>
        <div style="color:#a1a1aa; font-size:14px; margin-top:5px;">Pocket Camera Interface</div>
    </div>

    <div id="badge-safe" class="badge-safe">✅ PATHWAY CLEAR - No critical obstacles detected</div>
    <div id="badge-critical" class="badge-critical">⚠️ CRITICAL PROXIMITY - HAZARD AHEAD</div>

    <div class="camera-container">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <div class="narrative-box">
        <h3>🔊 Audio Guidance</h3>
        <p id="narrative-text">Ready to start navigation. Point camera forward.</p>
    </div>

    <div class="controls">
        <button id="btn-start" class="btn-start">🟢 START LIVE STREAM</button>
        <button id="btn-stop" class="btn-stop">🛑 STOP</button>
        <button id="btn-vqa" class="btn-vqa">🎤 ASK QUESTION</button>
    </div>

    <div id="status-conn" class="status">Disconnected</div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const btnVqa = document.getElementById('btn-vqa');
        
        const badgeSafe = document.getElementById('badge-safe');
        const badgeCritical = document.getElementById('badge-critical');
        const narrativeText = document.getElementById('narrative-text');
        const statusConn = document.getElementById('status-conn');

        let stream = null;
        let intervalId = null;
        let isActive = false;
        let isProcessing = false;
        
        // Setup Speech Synthesis
        const synth = window.speechSynthesis;
        function speak(text) {
            if (!text || !synth) return;
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            synth.speak(utterance);
        }

        // Setup Camera
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: {ideal: 640}, height: {ideal: 480} } 
                });
                video.srcObject = stream;
                statusConn.textContent = "Camera Active";
            } catch (err) {
                alert("Camera Error: " + err.message + "\nEnsure you are using HTTPS and have granted permissions.");
                throw err;
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            video.srcObject = null;
        }

        function captureFrame() {
            if (video.readyState < 2) return null;
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            return canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
        }

        // Main YOLO Loop
        async function processFrame() {
            if (!isActive || isProcessing) return;
            const image = captureFrame();
            if (!image) return;
            
            isProcessing = true;
            statusConn.textContent = "Analyzing Scene...";
            
            try {
                const response = await fetch('/api/process_frame', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({image})
                });
                const data = await response.json();
                
                // Update UI
                if (data.hazard_level === 'critical') {
                    badgeSafe.style.display = 'none';
                    badgeCritical.style.display = 'block';
                    badgeCritical.innerHTML = `⚠️ CRITICAL PROXIMITY - HAZARD DETECTED`;
                } else {
                    badgeCritical.style.display = 'none';
                    badgeSafe.style.display = 'block';
                }
                
                narrativeText.textContent = data.narrative;
                speak(data.narrative);
                statusConn.textContent = `Live | FPS Tracking | Latency: ${data.latency_ms}ms`;
                
            } catch (e) {
                statusConn.textContent = "Connection Error";
            } finally {
                isProcessing = false;
            }
        }

        // Button Listeners
        btnStart.addEventListener('click', async () => {
            isActive = true;
            btnStart.style.display = 'none';
            btnStop.style.display = 'flex';
            btnVqa.style.display = 'flex';
            badgeSafe.style.display = 'block';
            
            speak("System initialized. Pathway monitoring active.");
            
            try {
                await startCamera();
                intervalId = setInterval(processFrame, 3000);
            } catch (e) {
                isActive = false;
                btnStart.style.display = 'flex';
                btnStop.style.display = 'none';
                btnVqa.style.display = 'none';
            }
        });

        btnStop.addEventListener('click', () => {
            isActive = false;
            clearInterval(intervalId);
            stopCamera();
            synth.cancel();
            
            btnStart.style.display = 'flex';
            btnStop.style.display = 'none';
            btnVqa.style.display = 'none';
            badgeSafe.style.display = 'none';
            badgeCritical.style.display = 'none';
            
            narrativeText.textContent = "Navigation Paused.";
            statusConn.textContent = "Disconnected";
        });

        // Speech Recognition for VQA
        btnVqa.addEventListener('click', () => {
            if (!isActive) return;
            
            // Pause regular processing
            clearInterval(intervalId);
            synth.cancel();
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (SpeechRecognition) {
                btnVqa.style.backgroundColor = '#ef4444';
                btnVqa.innerHTML = '🎙️ LISTENING...';
                speak("I am listening.");
                
                const recognition = new SpeechRecognition();
                recognition.continuous = false;
                
                setTimeout(() => { recognition.start(); }, 1500);

                recognition.onresult = async (event) => {
                    const question = event.results[0][0].transcript;
                    executeVQA(question);
                };
                
                recognition.onerror = (e) => {
                    // Fallback to text prompt if Mic fails (e.g. self-signed cert blocks it on iOS)
                    const fallbackQ = prompt("Microphone blocked. Please type your question:");
                    if (fallbackQ) {
                        executeVQA(fallbackQ);
                    } else {
                        resetVqaBtn();
                    }
                };
            } else {
                // Browser doesn't support Speech API, use text prompt
                const fallbackQ = prompt("Your browser does not support Voice. Type your question:");
                if (fallbackQ) {
                    executeVQA(fallbackQ);
                } else {
                    resetVqaBtn();
                }
            }
        });
        
        async function executeVQA(question) {
            btnVqa.style.backgroundColor = '#3b82f6';
            btnVqa.innerHTML = '🧠 THINKING...';
            
            speak("Let me look.");
            narrativeText.textContent = `Q: ${question} ... Thinking...`;
            
            const image = captureFrame();
            if(image) {
                try {
                    const response = await fetch('/api/vqa', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({image, question})
                    });
                    const data = await response.json();
                    speak(data.answer);
                    narrativeText.textContent = `A: ${data.answer}`;
                } catch(e) {
                    speak("Network error.");
                    narrativeText.textContent = "Error reaching VQA server.";
                }
            }
            
            // Resume after 8 seconds to give time to hear the answer
            setTimeout(() => {
                resetVqaBtn();
                intervalId = setInterval(processFrame, 3000);
            }, 8000);
        }
        
        function resetVqaBtn() {
            btnVqa.style.backgroundColor = '#3b82f6';
            btnVqa.innerHTML = '🎤 ASK QUESTION';
        }

    </script>
</body>
</html>
